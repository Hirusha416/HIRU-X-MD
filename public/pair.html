<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>HIRU X MD - Pair Code</title>
<style>*{box-sizing:border-box;font-family:system-ui}body{margin:0;background:#0a0a0f;color:#fff;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px}.card{background:#15151f;border-radius:20px;padding:28px;width:100%;max-width:420px;text-align:center}.title{font-size:28px;font-weight:900}input{width:100%;padding:14px;border-radius:12px;background:#0d0d14;color:#fff;font-size:16px;margin:14px 0}button{width:100%;padding:14px;border:0;border-radius:12px;background:#00e676;font-weight:800;font-size:16px;cursor:pointer}.code{margin-top:18px;background:#00e676;color:#000;font-size:32px;font-weight:900;letter-spacing:6px;padding:14px;border-radius:12px;display:none}.steps{text-align:left;font-size:13px;color:#bbb;margin-top:18px;line-height:1.8}</style></head>
<body><div class="card"><div style="font-size:42px">⚡</div><div class="title">HIRU X MD</div><div>👑 Owner: HIRUSHA X MD<br>📱 +94715988504</div>
<input id="num" placeholder="94715988504" value="94715988504" maxlength="11">
<button id="btn" onclick="getCode()">GET PAIR CODE 🔗</button>
<div id="msg" style="margin-top:12px;color:#ff6b6b"></div><div class="code" id="codeBox"></div>
<div class="steps"><b>Steps:</b><br>1. GET PAIR CODE obanna<br>2. WhatsApp > Linked Devices > Link a Device<br>3. Link with Phone Number > Code eka gahanna<br>4. Bot connect wenawa ✅</div></div>
<script>async function getCode(){const num=document.getElementById('num').value.trim();const msg=document.getElementById('msg');const box=document.getElementById('codeBox');const btn=document.getElementById('btn');btn.disabled=true;btn.textContent='Generating...';try{const r=await fetch('/api/pair',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({number:num})});const d=await r.json();if(d.success){box.style.display='block';box.textContent=d.code;msg.style.color='#00e676';msg.textContent='✅ Code eka hambuna!';}else{msg.textContent='❌ '+d.message;}}catch(e){msg.textContent='❌ Server error';}btn.disabled=false;btn.textContent='GET PAIR CODE 🔗';}</script></body></html>
